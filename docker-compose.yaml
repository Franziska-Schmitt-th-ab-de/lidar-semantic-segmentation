services:
  semanticlidar:
    shm_size: 24G
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID}
        USER_NAME: ${USER_NAME}
    image: semanticlidar:0.1
    container_name: semantic_project
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./dataset:/workspace/dataset
      - ./src:/workspace/src
      - /tmp/.X11-unix:/tmp/.X11-unix
    entrypoint: ["/workspace/entrypoint.sh"]
    runtime: nvidia
    env_file:
      - .env
    ports:
      - "6006:6006"
